# Weekly pull requests for newer Sparkle (SwiftPM) and GitHub Actions versions.
# Merging one doesn't publish a release; the next VERSION bump ships it.
version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
    # Replaces the default labels; skip-release-notes keeps these out of release notes.
    labels: [dependencies, skip-release-notes]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Replaces the default labels; skip-release-notes keeps these out of release notes.
    labels: [dependencies, skip-release-notes]
